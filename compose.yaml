services:
  web:
    build: .
    ports:
      - "0.0.0.0:${WEB_PORT:-8080}:80"
    env_file: .env
    volumes:
      - .:/var/www/html
      - uploads:/var/www/html/storage/uploads
    depends_on:
      init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
  init:
    build: .
    env_file: .env
    command: ["php", "bin/console.php", "migrate"]
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-marked}
      MYSQL_USER: ${DB_USERNAME:-marked}
      MYSQL_PASSWORD: ${DB_PASSWORD:-marked-local-only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local-only}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --connect-timeout=3 --execute="SELECT 1" --silent > /dev/null'
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
  scheduler:
    build: .
    env_file: .env
    volumes:
      - .:/var/www/html
    command: ["sh", "-c", "while true; do php bin/console.php mail; php bin/console.php digest; sleep 60; done"]
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  database:
  uploads:
